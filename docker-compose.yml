# Local Postgres for development and tests -- the same engine production runs
# on Render. See ADR-0005 for why a laptop does not get SQLite instead.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: joostmagheteten
      POSTGRES_USER: joostmagheteten
      POSTGRES_PASSWORD: joostmagheteten
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joostmagheteten"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
